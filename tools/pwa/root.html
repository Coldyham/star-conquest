<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c14">
<title>Star Conquest</title>
<link rel="icon" type="image/png" href="/favicon.png">
<!--
  The site root, staged as web/index.html by tools/build_web.sh. The leaderboard
  is the front page (/board/) and the game lives at /play/, but every link the
  game ever shared points at this root with the payload in the fragment —
  challenge (#<token>), replay (#log=…) and play-by-post seat links alike — and a
  fragment never reaches the server, so only a script here can tell them apart:

  - a fragment goes to the game, fragment intact;
  - an installed app (standalone/fullscreen) is the manifest's start_url, and
    reopens whichever half it was last on (sc_app_last, written by the board's
    nav.mjs and the game page's own head, only inside the installed app),
    the game if it has never been anywhere;
  - anything else is a visitor, and gets the board.
-->
<script>
(function () {
  var standalone = navigator.standalone === true ||
    (window.matchMedia && window.matchMedia(
      "(display-mode: standalone), (display-mode: fullscreen)").matches);
  var last = null;
  try { last = localStorage.getItem("sc_app_last"); } catch (e) {}
  var game = location.hash.length > 1 || (standalone && last !== "board");
  // Going to the game: show its loading screen now, not a bare page of links.
  if (game) document.documentElement.className = "to-game";
  location.replace((game ? "/play/" : "/board/") + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/board/"></noscript>
<style>
html, body { background: #0a0c14; color: #c8cdd7; font-family: system-ui, sans-serif; }
#loading { display: none; }
/* The same screen as webapp/index.html's #loading (css/play.css). */
.to-game body > p { display: none; }
.to-game #loading {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; padding: 16px;
  background: radial-gradient(circle at 50% 42%, rgb(22, 30, 56), #0a0c14 60%);
}
#loading svg { width: min(160px, 36vmin); height: auto; animation: loading-pulse 1.8s ease-in-out infinite; }
#loading h1 { margin: 6px 0 0; font-size: clamp(22px, 6vmin, 34px); letter-spacing: .08em; }
#loading p { margin: 0; color: rgb(140, 148, 165); }
@keyframes loading-pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { #loading svg { animation: none; } }
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="rgb(74,84,116)" stroke-width="1.6"><line x1="50" y1="46" x2="24" y2="28"/><line x1="50" y1="46" x2="78" y2="30"/><line x1="50" y1="46" x2="80" y2="72"/><line x1="50" y1="46" x2="26" y2="74"/><line x1="50" y1="46" x2="50" y2="84"/><line x1="24" y1="28" x2="26" y2="74"/><line x1="78" y1="30" x2="80" y2="72"/></g>
    <g><circle cx="50" cy="46" r="15" fill="rgb(86,170,255)"/><circle cx="24" cy="28" r="5.8" fill="rgb(240,90,90)"/><circle cx="78" cy="30" r="6.2" fill="rgb(95,210,130)"/><circle cx="80" cy="72" r="5.5" fill="rgb(240,170,70)"/><circle cx="26" cy="74" r="7" fill="rgb(190,130,240)"/><circle cx="50" cy="84" r="4.8" fill="rgb(122,128,140)"/></g>
  </svg>
  <h1>STAR CONQUEST</h1>
  <p>Loading the game…</p>
</div>
<p><a href="/board/" style="color:#56aaff">Leaderboard</a> · <a href="/play/" style="color:#56aaff">Play Star Conquest</a></p>
</body>
</html>
