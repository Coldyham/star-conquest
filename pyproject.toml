[project]
name = "starconquest"
version = "0.1.0"
description = "A minimalist sci-fi turn-based strategy game (graph-node star map conquest)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pygame-ce (Community Edition): a drop-in for pygame (same `import pygame`,
    # same API surface this game uses) that is actively maintained and is what
    # pygbag compiles to WebAssembly for the browser build.
    "pygame-ce>=2.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Web (browser/WebAssembly) build tooling — see tools/build_web.sh.
    "pygbag>=0.9.3",
    "pip",            # pygbag's build/dev server shells out to `python -m pip`
]

[tool.ruff.lint]
# Guarded calls that must never take the game down swallow failures on purpose.
ignore = ["S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# The browser/storage bridges: every DOM or filesystem call is guarded wholesale.
"starconquest/{webstore,softkeyboard,paths,settings}.py" = ["BLE001"]
"main.py" = ["BLE001"]
"tools/{check_bot,config_census}.py" = ["BLE001"]
