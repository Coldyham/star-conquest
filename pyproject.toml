[project]
name = "starconquest"
version = "0.1.0"
description = "A minimalist sci-fi turn-based strategy game (graph-node star map conquest)."
readme = "README.md"
requires-python = ">=3.12"
# The game needs nothing beyond the standard library: it runs in the browser
# (Pyodide), served on this machine by `starconquest/serve.py`.
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "jinja2>=3.1.6",  # the leaderboard pages are templates — see tools/render_board.py
    # Only as an image library, for two offline tools: the home-screen icons
    # (tools/pwa/make_icons.py) and the parity contact sheets (tools/parity_sheet.py).
    "pygame-ce>=2.5",
]

[tool.ruff.lint]
# Guarded calls that must never take the game down swallow failures on purpose;
# __slots__ list fields in their constructor's order; imports keep their hand wrapping;
# multi-line messages in a list are implicit concatenation on purpose.
ignore = ["S110", "S112", "RUF023", "I001", "ISC004"]

[tool.ruff.lint.per-file-ignores]
# The browser/storage bridges: every DOM or filesystem call is guarded wholesale.
"starconquest/{webstore,paths,settings}.py" = ["BLE001"]
"tools/{check_bot,config_census}.py" = ["BLE001"]
