# A one-off, manually-triggered report on what tools/position_suite.py,
# tools/config_census.py and tools/setup_sweep.py say about the roster once
# measured against real human games instead of bot-vs-bot self-play — see
# "Positions from real games" in docs/bot-design.md for what the numbers mean
# and how to read them.
#
# Not scheduled: unlike bot-replay.yml this computes nothing the board serves,
# it is a research report for whoever is retuning the roster, read from the
# job summary and thrown away otherwise. Reuses the same repository secrets as
# bot-replay.yml rather than asking for its own.
#
# Each tool gets its own timeout-minutes, well inside the job's own, so a
# corpus that turns out bigger than expected costs that tool its report
# rather than the whole run — the first attempt at this let position_suite
# eat all 30 minutes and setup_sweep never got to start. `python -u` plus
# `tee` (rather than a plain `>>` group redirect) means a step killed by its
# own timeout still leaves whatever it printed before that in both the job
# summary and the raw log — a bare redirect only flushes at the *process's*
# own exit, which a mid-run kill never reaches.
name: Human-score report

on:
  workflow_dispatch:
    inputs:
      position_suite_games:
        description: "position_suite.py --games (0 = every game in the corpus)"
        required: false
        default: "15"
      setup_sweep_seeds:
        description: "setup_sweep.py --seeds (games per bot per arm)"
        required: false
        default: "40"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the board is configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_KEY" ]; }; then
            echo "No Supabase secrets set — skipping (see bot-replay.yml's header)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: config_census (public tables, no secret needed)
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 5
        run: |
          echo "## config_census.py" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -u tools/config_census.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: position_suite --supabase
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 18
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GAMES: ${{ inputs.position_suite_games }}
        run: |
          echo "## position_suite.py --supabase --games $GAMES" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -u tools/position_suite.py --supabase --games "$GAMES" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: setup_sweep (most-played setup vs defaults)
        if: steps.check.outputs.ready == 'true'
        timeout-minutes: 18
        env:
          SEEDS: ${{ inputs.setup_sweep_seeds }}
        run: |
          echo "## setup_sweep.py --seeds $SEEDS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -u tools/setup_sweep.py --seeds "$SEEDS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
