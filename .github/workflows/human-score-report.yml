# A one-off, manually-triggered report on what tools/position_suite.py,
# tools/config_census.py and tools/setup_sweep.py say about the roster once
# measured against real human games instead of bot-vs-bot self-play — see
# "Positions from real games" in docs/bot-design.md for what the numbers mean
# and how to read them.
#
# Not scheduled: unlike bot-replay.yml this computes nothing the board serves,
# it is a research report for whoever is retuning the roster, read from the
# job summary and thrown away otherwise. Reuses the same repository secrets as
# bot-replay.yml rather than asking for its own.
name: Human-score report

on:
  workflow_dispatch:
    inputs:
      setup_sweep_seeds:
        description: "setup_sweep.py --seeds (games per bot per arm)"
        required: false
        default: "40"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the board is configured
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_KEY" ]; }; then
            echo "No Supabase secrets set — skipping (see bot-replay.yml's header)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: config_census (public tables, no secret needed)
        if: steps.check.outputs.ready == 'true'
        run: |
          {
            echo "## config_census.py"
            echo '```'
            python tools/config_census.py || echo "(failed, see job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: position_suite --supabase
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          {
            echo "## position_suite.py --supabase"
            echo '```'
            python tools/position_suite.py --supabase || echo "(failed, see job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: setup_sweep (most-played setup vs defaults)
        if: steps.check.outputs.ready == 'true'
        env:
          SEEDS: ${{ inputs.setup_sweep_seeds }}
        run: |
          {
            echo "## setup_sweep.py --seeds $SEEDS"
            echo '```'
            python tools/setup_sweep.py --seeds "$SEEDS" || echo "(failed, see job log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
