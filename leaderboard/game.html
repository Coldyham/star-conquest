{% extends "templates/base.html" %}
{% set title = "Map scores" %}
{% set script = "js/game.mjs" %}

{% block main %}
  <a class="back" href="index.html">← All maps</a>
  <h1 id="setup">Loading…</h1>
  <div id="setup-tags" class="card-tags"></div>
  <p class="lede" id="subtitle"></p>
  <div id="sort"></div>
  <div id="scores" class="loading">Loading…</div>

  <!-- How each models/ bot fares in the player's seat on this exact map,
       computed offline by .github/workflows/bot-replay.yml. Empty until that
       job has run, so the whole section hides itself rather than showing a
       placeholder on a board that has never had a worker pointed at it. -->
  <section id="bots" class="bots" hidden>
    <h2>How the bots did</h2>
    <p class="lede" id="bots-lede"></p>
    <div id="bots-table"></div>
  </section>
{% endblock %}

{% block footer %}Think you can beat that? &nbsp;·&nbsp;
  <a href="submit.html">Enter a score</a>{% endblock %}
