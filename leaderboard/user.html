<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Star Conquest Leaderboard</title>
<link rel="icon" type="image/png" href="favicon.png" sizes="16x16">
<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html">Star Conquest <span>High Scores</span></a>
  <nav class="actions">
    <a class="btn" href="submit.html">Enter score</a>
  </nav>
</header>

<main>
  <a class="back" href="index.html">← All maps</a>
  <h1 id="who">Loading…</h1>
  <p class="lede" id="lede">
    Every map this player has posted a score on, and where each one places.
  </p>

  <div id="tally"></div>

  <form id="compare" class="compare" autocomplete="off">
    <input id="rival" type="text" maxlength="60" aria-label="Add a player to compare"
           placeholder="Add a rival…">
    <button class="mini" type="submit">Compare</button>
    <span id="extras"></span>
  </form>

  <div id="scores" class="loading">Loading…</div>
</main>

<footer class="attract">
  <span class="coin">▚</span> Player 1 &nbsp;·&nbsp;
  <a href="index.html">All maps</a> &nbsp;·&nbsp;
  <a href="submit.html">Enter a score</a>
</footer>

<script type="module" src="js/user.mjs"></script>
</body>
</html>
